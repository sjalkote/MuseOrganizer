# Regenerate the Xcode project with: xcodegen generate
name: MuseOrganizer
options:
  bundleIdPrefix: com.sjalkote
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 7K6CXFJBDB
    SWIFT_VERSION: "5.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: "YES"
    ENABLE_PREVIEWS: "YES"
    CODE_SIGN_STYLE: Automatic
targets:
  MuseOrganizer:
    type: application
    platform: iOS
    sources:
      - MuseOrganizer
      - Shared
    dependencies:
      - target: HuddleMessages
      - target: HuddleShare
    entitlements:
      path: Config/MuseOrganizer.entitlements
      properties:
        com.apple.security.application-groups: [group.com.sjalkote.MuseOrganizer]
    info:
      path: Config/Huddle-Info.plist
      properties:
        LSApplicationQueriesSchemes: [whatsapp, instagram, sms]
        # Same paper color as the intro screen, so launch → intro → Home is one continuous color.
        UILaunchScreen:
          UIColorName: LaunchBackground
        # Muse price watch re-checks prices when iOS wakes the app (PriceWatchCenter.refreshTaskID).
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.sjalkote.MuseOrganizer.pricewatch]
        # Plan folders use the Huddle backend when this is set (docs/GOOGLE_WORKSPACE_SETUP.md).
        HUDDLE_BACKEND_URL: $(HUDDLE_BACKEND_URL)
        # Plain http to localhost / the Mac's LAN address while developing.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: com.sjalkote.huddle
            CFBundleURLSchemes: [huddle]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sjalkote.MuseOrganizer
        HUDDLE_BACKEND_URL: "http://127.0.0.1:8000"
        PRODUCT_NAME: MuseOrganizer
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: NxT
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"

  HuddleMessages:
    type: app-extension.messages
    platform: iOS
    sources:
      - HuddleMessages
      - Shared
      - path: MuseOrganizer/DesignSystem/Theme.swift
    entitlements:
      path: Config/HuddleMessages.entitlements
      properties:
        com.apple.security.application-groups: [group.com.sjalkote.MuseOrganizer]
    info:
      path: Config/HuddleMessages-Info.plist
      properties:
        CFBundleDisplayName: NxT
        NSExtension:
          NSExtensionPointIdentifier: com.apple.message-payload-provider
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MessagesViewController
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sjalkote.MuseOrganizer.Messages
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
  HuddleShare:
    type: app-extension
    platform: iOS
    sources:
      - HuddleShare
      - Shared
      - path: MuseOrganizer/DesignSystem/Theme.swift
    entitlements:
      path: Config/HuddleShare.entitlements
      properties:
        com.apple.security.application-groups: [group.com.sjalkote.MuseOrganizer]
    info:
      path: Config/HuddleShare-Info.plist
      properties:
        CFBundleDisplayName: NxT
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sjalkote.MuseOrganizer.Share
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  MuseOrganizer:
    build:
      targets:
        MuseOrganizer: all
    run:
      config: Debug
  HuddleMessages:
    build:
      targets:
        HuddleMessages: all
        MuseOrganizer: all
    run:
      config: Debug
      askForAppToLaunch: true
